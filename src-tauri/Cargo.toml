[package]
name = "sunder"
version = "1.4.12"
edition = "2021"

[lib]
name = "sunder_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "sunder"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
# crates.io rodio releases do not ship a cpal with a PipeWire host: 0.20.1
# pins cpal 0.15 (ALSA-only on Linux, issue #43), 0.21.x pins cpal 0.16 and
# 0.22.x pins cpal 0.17. cpal 0.18 introduced the PipeWire and PulseAudio
# hosts; upstream rodio currently ships cpal 0.18.2 on its own
# backport-cpal-0.18 branch, still at version 0.22.2 (rust-version 1.87).
# Pin that branch until a crates.io rodio with cpal 0.18+ is published.
rodio = { git = "https://github.com/RustAudio/rodio", branch = "backport-cpal-0.18", default-features = false, features = ["playback", "symphonia-mp3", "symphonia-isomp4", "symphonia-aac", "symphonia-vorbis", "symphonia-flac", "symphonia-wav"] }
# Direct dep so the cpal `pipewire` cargo feature (PipeWire host, issue #43)
# is enabled; the rodio backport branch does not forward cpal platform
# features. Cargo unifies this with rodio's own cpal 0.18.2 dependency, so
# there is still exactly one cpal in the graph.
cpal = { version = "0.18.2", default-features = false, features = ["pipewire"] }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
chrono = "0.4"
regex-lite = "0.1"
souvlaki = "0.8.3"
futures = "0.3"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
