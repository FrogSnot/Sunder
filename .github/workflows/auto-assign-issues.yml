name: Auto-assign issues

on:
  issues:
    types: [opened, reopened, transferred]

# One run per issue event; never cancel an in-flight assignment.
concurrency:
  group: auto-assign-issues-${{ github.event.issue.number }}-${{ github.event.action }}
  cancel-in-progress: false

permissions:
  issues: write

jobs:
  assign:
    name: Assign lead maintainer
    runs-on: ubuntu-latest
    steps:
      - name: Assign FrogSnot
        uses: actions/github-script@v7
        with:
          script: |
            const assignee = 'FrogSnot';
            const issue_number = context.payload.issue.number;

            const current = context.payload.issue.assignees ?? [];
            if (current.some((a) => a.login === assignee)) {
              core.info(`${assignee} is already assigned to #${issue_number}, nothing to do`);
              return;
            }

            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              assignees: [assignee],
            });

            core.info(`Assigned ${assignee} to #${issue_number}`);
