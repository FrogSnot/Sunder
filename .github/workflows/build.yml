name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage,rpm
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            bundles: app
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libfuse2 \
            rpm

      - name: Cache PipeWire 0.3.85
        if: runner.os == 'Linux'
        id: pipewire-cache
        uses: actions/cache@v4
        with:
          path: /opt/pipewire-0.3.85
          key: ${{ runner.os }}-${{ matrix.target }}-pipewire-0.3.85

      - name: Build PipeWire 0.3.85 from source
        # libspa 0.10.1 (pulled by cpal 0.18.2's pipewire feature) does not
        # compile against Ubuntu 22.04's PipeWire 0.3.48 headers; build 0.3.85
        # so pkg-config picks up modern headers first (the apt libpipewire-0.3-dev
        # stays as pkg-config fallback).
        if: runner.os == 'Linux' && steps.pipewire-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y meson ninja-build pkg-config
          curl -fSL -o /tmp/pipewire-0.3.85.tar.gz \
            https://gitlab.freedesktop.org/pipewire/pipewire/-/archive/0.3.85/pipewire-0.3.85.tar.gz
          tar -xzf /tmp/pipewire-0.3.85.tar.gz -C /tmp
          cd /tmp/pipewire-0.3.85
          meson setup build --prefix=/opt/pipewire-0.3.85 \
            -Dalsa=disabled \
            -Djack=disabled \
            -Dlibpulse=disabled \
            -Dbluez5=disabled \
            -Dv4l2=disabled \
            -Ddocs=disabled \
            -Dexamples=disabled \
            -Dtests=disabled \
            -Dsession-managers=[] \
            -Dgstreamer=disabled \
            -Dsystemd=disabled
          ninja -C build
          sudo ninja -C build install

      - name: Export PipeWire pkg-config path
        if: runner.os == 'Linux'
        run: |
          PKGCONF_DIR=$(ls -d /opt/pipewire-0.3.85/lib/*/pkgconfig /opt/pipewire-0.3.85/lib/pkgconfig 2>/dev/null | head -1)
          if [ -z "$PKGCONF_DIR" ]; then
            echo "::error::no pkgconfig dir under /opt/pipewire-0.3.85"
            exit 1
          fi
          echo "using pkgconfig dir: $PKGCONF_DIR"
          echo "PKG_CONFIG_PATH=$PKGCONF_DIR" >> "$GITHUB_ENV"
          # rustc emits -L search paths after the -l names, so the linker still
          # resolves -lpipewire-0.3 from /usr/lib/x86_64-linux-gnu (apt 0.3.48,
          # which lacks modern symbols like pw_stream_get_time_n) regardless of
          # PKG_CONFIG_PATH. Repoint the dev symlink at our 0.3.85 so link and
          # headers agree.
          LIBSO=$(ls /opt/pipewire-0.3.85/lib/libpipewire-0.3.so /opt/pipewire-0.3.85/lib/*/libpipewire-0.3.so 2>/dev/null | head -1)
          if [ -z "$LIBSO" ]; then
            echo "::error::libpipewire-0.3.so not found under /opt/pipewire-0.3.85/lib"
            exit 1
          fi
          echo "relinking dev symlink to $LIBSO"
          sudo ln -sf "$LIBSO" /usr/lib/x86_64-linux-gnu/libpipewire-0.3.so
          if nm -D /usr/lib/x86_64-linux-gnu/libpipewire-0.3.so | grep -q pw_stream_get_time_n; then
            echo "libpipewire-0.3.so now provides pw_stream_get_time_n (0.3.85)"
          else
            echo "::error::relinked libpipewire-0.3.so still lacks pw_stream_get_time_n"
            exit 1
          fi

      - name: Verify PipeWire dev version
        if: runner.os == 'Linux'
        run: |
          VERSION=$(pkg-config --modversion libpipewire-0.3)
          echo "libpipewire-0.3 modversion: $VERSION"
          if [ "$VERSION" != "0.3.85" ]; then
            echo "::error::expected libpipewire-0.3 0.3.85, got $VERSION"
            exit 1
          fi

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Syncing version to $VERSION"
          sed -i.bak "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          sed -i.bak "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" package.json
          sed -i.bak "0,/^version = /s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          rm -f src-tauri/tauri.conf.json.bak package.json.bak src-tauri/Cargo.toml.bak

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Upload .deb
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: sunder-linux-deb
          path: src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb

      - name: Upload .rpm
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: sunder-linux-rpm
          path: src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm

      - name: Upload .AppImage
        if: runner.os == 'Linux'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sunder-linux-appimage
          path: src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

      - name: Upload .dmg
        if: matrix.bundles == 'dmg'
        uses: actions/upload-artifact@v4
        with:
          name: sunder-macos-dmg-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - name: Upload macOS app (x86_64)
        if: matrix.bundles == 'app'
        uses: actions/upload-artifact@v4
        with:
          name: sunder-macos-app-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/macos/

      - name: Upload NSIS installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: sunder-windows-nsis
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
